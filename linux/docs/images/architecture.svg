<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Noto Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <!-- The architecture diagram of .github/README.md; architecture.png is
       rendered from it: rsvg-convert -z 2 architecture.svg -o architecture.png -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="469" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- upstream GUI code -->
  <rect x="250" y="28" width="400" height="104" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="450" y="60" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">Upstream 7-Zip GUI code</text>
  <text x="450" y="86" text-anchor="middle" font-size="14" fill="#9da7b3">7-Zip File Manager and 7-Zip dialogs</text>
  <text x="450" y="108" text-anchor="middle" font-size="14" fill="#9da7b3">.rc layouts, menus and strings</text>

  <!-- archive engine -->
  <rect x="40" y="214" width="320" height="116" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="200" y="248" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">Archive engine</text>
  <text x="200" y="274" text-anchor="middle" font-size="14" fill="#9da7b3">formats, codecs, AES, hashes</text>
  <text x="200" y="306" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3fb950">upstream 7-Zip, unchanged</text>

  <!-- the port -->
  <rect x="480" y="190" width="380" height="164" rx="8" fill="#0d1117" stroke="#a371f7" stroke-width="1.5"/>
  <text x="670" y="222" text-anchor="middle" font-size="17" font-weight="bold" fill="#e6edf3">linux/: the port</text>
  <text x="504" y="252" font-size="14" fill="#9da7b3"><tspan fill="#d2a8ff" font-weight="bold">shim</tspan>  Win32 user32 and comctl32 on Qt 6</text>
  <text x="504" y="277" font-size="14" fill="#9da7b3"><tspan fill="#d2a8ff" font-weight="bold">rcgen.py</tspan>  layouts from the .rc files</text>
  <text x="504" y="302" font-size="14" fill="#9da7b3"><tspan fill="#d2a8ff" font-weight="bold">platform</tspan>  settings, POSIX folders, locale</text>
  <text x="504" y="327" font-size="14" fill="#9da7b3"><tspan fill="#d2a8ff" font-weight="bold">desktop</tspan>  Wayland, D-Bus, portals, menus</text>

  <!-- Qt -->
  <rect x="545" y="392" width="250" height="56" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
  <text x="670" y="416" text-anchor="middle" font-size="16" font-weight="bold" fill="#e6edf3">Qt 6 Widgets</text>
  <text x="670" y="437" text-anchor="middle" font-size="13.5" fill="#9da7b3">on Wayland or X11</text>

  <!-- arrows -->
  <path d="M380 132 C380 172 200 170 200 210" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="216" y="152" width="138" height="22" rx="11" fill="#21262d"/>
  <text x="285" y="167" text-anchor="middle" font-size="12.5" fill="#c9d1d9">archive operations</text>

  <path d="M520 132 C520 166 670 156 670 186" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="557" y="146" width="96" height="22" rx="11" fill="#21262d"/>
  <text x="605" y="161" text-anchor="middle" font-size="12.5" fill="#c9d1d9">Win32 calls</text>

  <path d="M670 354 L670 388" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
