# The Debian, Ubuntu, Fedora and openSUSE packages of the Linux port
# (linux/docs/RELEASE.md). Each one is built in a container of its
# distribution, with the unit tests (linux/packaging/deb/build.sh,
# linux/packaging/rpm/build.sh), then installed and started in a fresh
# container of that distribution (linux/packaging/install-test.sh). The
# portable releases (tar.gz, AppImage), which bring their own Qt, are built
# on Debian 12 (linux/packaging/portable/build.sh) and run on other
# distributions (run-test.sh). It runs only for a release (the release
# workflow calls it with the tag and attaches the packages) and by hand,
# to try the packaging of a branch before a release.
name: Packages

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vVERSION)
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-13, image: 'debian:13', format: deb }
          - { name: ubuntu-26.04, image: 'ubuntu:26.04', format: deb }
          - { name: fedora-43, image: 'fedora:43', format: rpm }
          - { name: fedora-44, image: 'fedora:44', format: rpm }
          - { name: opensuse-tumbleweed, image: 'opensuse/tumbleweed', format: rpm }
    env:
      # empty outside a release: the version is the last release of the
      # AppStream metadata
      TAG: ${{ inputs.tag }}
      IMAGE: ${{ matrix.image }}
      FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Build the package
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
            "linux/packaging/$FORMAT/build.sh" --deps out ${TAG#v}

      - name: Install and start the package
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
            linux/packaging/install-test.sh out/*."$FORMAT"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: out/*.${{ matrix.format }}
          if-no-files-found: error

  portable:
    name: portable (tar.gz, AppImage)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Build the portable releases
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12 \
            linux/packaging/portable/build.sh --deps out ${TAG#v}

      - name: Run them on other distributions
        run: |
          for image in ubuntu:24.04 fedora:44 archlinux:latest; do
            echo "::group::$image"
            docker run --rm -v "$PWD:/src" -w /src "$image" \
              linux/packaging/portable/run-test.sh out/*.tar.gz out/*.AppImage
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: package-portable
          path: |
            out/*.tar.gz
            out/*.AppImage
          if-no-files-found: error
